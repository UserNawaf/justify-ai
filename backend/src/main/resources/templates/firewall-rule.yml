# Firewall rule request. Field order = order in the rendered justification.
id: firewall-rule
name: Firewall rule request
description: Request to open network access between a source and a destination.
fields:
  - key: business_purpose
    label: Business purpose
    required: true
    description: Why the access is needed, in business terms (which application, which process).
    question: What is the business purpose of this rule? Which application or process needs it?
  - key: source
    label: Source
    required: true
    description: Where the traffic starts. Hostname and/or IP address or subnet.
    question: What is the source (server name and IP address or subnet)?
  - key: destination
    label: Destination
    required: true
    description: Where the traffic goes. Hostname, URL and/or IP address.
    question: What is the destination (hostname or URL and IP address)?
  - key: port_protocol
    label: Port / protocol
    required: true
    description: Port number(s) and protocol, e.g. TCP 443.
    question: Which port and protocol are needed (for example TCP 443)?
  - key: duration
    label: Duration
    required: true
    description: Permanent, or temporary with an end date.
    question: Is this rule permanent or temporary? If temporary, until when?
  - key: impact_if_rejected
    label: Impact if rejected
    required: true
    description: What breaks or is delayed for the business if the rule is not opened.
    question: What happens to the business if this rule is not opened?
  - key: data_classification
    label: Data classification
    required: false
    description: Classification of the data crossing the rule (public, internal, confidential, restricted).
    question: What is the classification of the data (public, internal, confidential, restricted)?
