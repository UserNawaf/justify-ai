# One-click demo on Render: Dashboard -> New -> Blueprint -> pick this repo.
# Creates PostgreSQL + the API (Groq, dummy data only) + the web app. Flyway builds the schema on start.
databases:
  - name: justify-db
    plan: free
    databaseName: justify
    user: justify
    postgresMajorVersion: "16"

services:
  - type: web
    name: justify-ai-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: justify-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: justify-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: justify-db, property: database }
      - key: DB_USER
        fromDatabase: { name: justify-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: justify-db, property: password }
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # Render asks for it once; never stored in the repo
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"

  - type: web
    name: justify-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Same-origin /api, like nginx in Docker Compose (no CORS, D12).
      # If Render gave the API another URL, change it here.
      - type: rewrite
        source: /api/*
        destination: https://justify-ai-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
