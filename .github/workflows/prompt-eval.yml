name: Prompt evaluation

# Measures the prompt against real models (docs/TESTING.md section 3). Not part of CI: results vary.
# Runs when the prompt, the golden set or this file change, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - backend/src/main/java/com/justify/ai/PromptBuilder.java
      - backend/src/test/resources/eval/**
      - .github/workflows/prompt-eval.yml

jobs:
  ollama:
    name: ollama ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ["llama3.1:8b", "qwen2.5:7b"]
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pull model
        run: |
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags >/dev/null && break; sleep 2; done
          curl -sf localhost:11434/api/pull -d '{"model":"${{ matrix.model }}","stream":false}' | tail -c 200
      - name: Evaluate
        env:
          RUN_AI_EVAL: "true"
          AI_PROVIDER: ollama
          OLLAMA_MODEL: ${{ matrix.model }}
        run: mvn -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=PromptEvalIT
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat target/prompt-eval.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  groq:
    name: groq ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip without secret
        if: env.GROQ_API_KEY == ''
        working-directory: .
        run: echo "Add the GROQ_API_KEY repository secret to run this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''
      - uses: actions/setup-java@v4
        if: env.GROQ_API_KEY != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Evaluate
        if: env.GROQ_API_KEY != ''
        env:
          RUN_AI_EVAL: "true"
          AI_PROVIDER: groq
          GROQ_MODEL: ${{ matrix.model }}
        run: mvn -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=PromptEvalIT
      - name: Summary
        if: always() && env.GROQ_API_KEY != ''
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat target/prompt-eval.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
